<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Land Plot 3D Exploded Stratification Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      overflow: hidden;
      background-color: #0b0f19;
      user-select: none;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      height: 6px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-200">

  <canvas id="webgl-canvas"></canvas>

  <!-- Top Control Bar -->
  <header class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-20">
    <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 pointer-events-auto shadow-2xl">
      <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-lg">🌍</div>
      <div>
        <h1 class="text-sm font-semibold tracking-wide text-white">LAND PLOT 3D STRATIFICATION</h1>
        <p class="text-[11px] text-slate-400">Geological & Utility Cross-Section</p>
      </div>
    </div>

    <div class="glass-panel px-2 py-1.5 rounded-2xl flex items-center gap-1 pointer-events-auto shadow-2xl">
      <button id="btn-iso" class="px-3 py-1.5 text-xs font-medium rounded-xl hover:bg-white/10 transition text-slate-200">ISO View</button>
      <button id="btn-section" class="px-3 py-1.5 text-xs font-medium rounded-xl hover:bg-white/10 transition text-slate-200">Section</button>
      <button id="btn-reset" class="px-3 py-1.5 text-xs font-medium rounded-xl hover:bg-white/10 transition text-rose-300">Reset</button>
    </div>
  </header>

  <!-- Left Control Panel -->
  <aside class="absolute bottom-5 left-5 w-80 glass-panel rounded-2xl p-4 pointer-events-auto shadow-2xl z-20 flex flex-col gap-4 max-h-[85vh] overflow-y-auto custom-scrollbar">

    <!-- Vertical Explosion Control -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-300">Stratification Depth</label>
        <span id="slider-val-text" class="text-xs font-mono font-bold text-emerald-400">0%</span>
      </div>
      <input id="explode-slider" type="range" min="0" max="100" value="0" class="w-full">
      <div class="flex justify-between text-[10px] text-slate-400 mt-1 font-mono">
        <span>Surface Level</span>
        <span>Deep Strata (100%)</span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="grid grid-cols-2 gap-2">
      <button id="btn-auto" class="py-2 px-3 text-xs font-medium rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/30 text-emerald-300 transition active:scale-95">Auto Cycle</button>
      <button id="btn-turntable" class="py-2 px-3 text-xs font-medium rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/10 text-slate-300 transition active:scale-95">Rotate</button>
    </div>

    <div class="h-[1px] bg-white/10"></div>

    <!-- Layer Toggles -->
    <div>
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2.5">Geological Layers</h3>
      <div id="layers-container" class="flex flex-col gap-1.5">
        <!-- Inserted dynamically -->
      </div>
    </div>

    <div class="text-[10px] text-slate-400 flex items-center gap-2 bg-slate-900/50 p-2.5 rounded-xl border border-white/5">
      📍 Hover elements to inspect. Drag to rotate. Scroll to zoom.
    </div>
  </aside>

  <!-- Hover Inspection Card -->
  <div id="inspector-card" class="absolute hidden glass-panel pointer-events-none p-3 rounded-xl border border-emerald-500/30 shadow-2xl z-30 max-w-xs">
    <div class="flex items-center gap-2 mb-1">
      <span id="tt-badge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase">L1</span>
      <h4 id="tt-title" class="text-xs font-bold text-white">Layer Name</h4>
    </div>
    <p id="tt-desc" class="text-[11px] text-slate-300 leading-snug mb-2">Description here.</p>
    <div class="flex justify-between items-center text-[10px] text-slate-400 font-mono">
      <span id="tt-label">Depth:</span>
      <span id="tt-value" class="text-emerald-300 font-semibold">-2.5m</span>
    </div>
  </div>

  <script>
    // Scene setup
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b111e);
    scene.fog = new THREE.FogExp2(0x0b111e, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(35, 28, 38);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 15;
    controls.maxDistance = 120;
    controls.target.set(0, 5, 0);

    // Ground grid
    const gridHelper = new THREE.GridHelper(60, 60, 0x10b981, 0x1e293b);
    gridHelper.position.y = -7.1;
    scene.add(gridHelper);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.3);
    dirLight.position.set(30, 50, 25);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    const d = 30;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
    fillLight.position.set(-30, 20, -25);
    scene.add(fillLight);

    // Materials
    const materials = {
      bedrock: new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 }),
      granite: new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.85 }),
      soil: new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.8 }),
      clay: new THREE.MeshStandardMaterial({ color: 0xa16207, roughness: 0.75 }),
      sand: new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.7 }),
      water: new THREE.MeshPhysicalMaterial({ color: 0x0284c7, transmission: 0.85, opacity: 0.7, transparent: true, roughness: 0.1 }),
      pipeSewage: new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.4, metalness: 0.4 }),
      pipeWater: new THREE.MeshStandardMaterial({ color: 0x06b6d4, roughness: 0.4, metalness: 0.5 }),
      pipeElectric: new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.4, metalness: 0.3 }),
      topsoil: new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.7 }),
      grass: new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.8 }),
      wireframe: new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true, transparent: true, opacity: 0.3 })
    };

    // Layer configurations
    const layersConfig = [
      {
        name: 'Topsoil & Vegetation',
        tag: 'L0',
        desc: 'Fertile organic topsoil layer supporting grass and agricultural coverage.',
        label: 'Depth:',
        value: '0.0 - 0.6m',
        baseY: 0,
        explosion: 0.0,
        color: 'text-green-400 bg-green-500/20 border-green-500/30',
        group: new THREE.Group()
      },
      {
        name: 'Clay & Silt Subsoil',
        tag: 'L1',
        desc: 'Medium plasticity clay layer with low permeability, typical bearing capacity 150-200 kPa.',
        label: 'Depth:',
        value: '0.6 - 2.0m',
        baseY: 0,
        explosion: 6.0,
        color: 'text-amber-400 bg-amber-500/20 border-amber-500/30',
        group: new THREE.Group()
      },
      {
        name: 'Sand & Gravel Stratum',
        tag: 'L2',
        desc: 'Medium to coarse sand with gravel interbeds. Good drainage, SPT N-value 12-18.',
        label: 'Depth:',
        value: '2.0 - 4.5m',
        baseY: 0,
        explosion: 12.0,
        color: 'text-yellow-400 bg-yellow-500/20 border-yellow-500/30',
        group: new THREE.Group()
      },
      {
        name: 'Groundwater Aquifer',
        tag: 'L3',
        desc: 'Water table elevation at -3.5m GRL. Confined aquifer with moderate yield capacity.',
        label: 'Depth:',
        value: '3.5 - 5.5m',
        baseY: 0,
        explosion: 18.0,
        color: 'text-blue-400 bg-blue-500/20 border-blue-500/30',
        group: new THREE.Group()
      },
      {
        name: 'Weathered Rock & Laterite',
        tag: 'L4',
        desc: 'Residual granite and laterite layer. Variable bearing capacity 200-300 kPa.',
        label: 'Depth:',
        value: '5.5 - 8.0m',
        baseY: 0,
        explosion: 24.0,
        color: 'text-orange-400 bg-orange-500/20 border-orange-500/30',
        group: new THREE.Group()
      },
      {
        name: 'Fresh Granite Bedrock',
        tag: 'L5',
        desc: 'Massive granitic basement rock, extremely competent. Safe bearing 2000+ kPa.',
        label: 'Depth:',
        value: '8.0m+',
        baseY: 0,
        explosion: 30.0,
        color: 'text-slate-400 bg-slate-500/20 border-slate-500/30',
        group: new THREE.Group()
      }
    ];

    // Build Layer 0 - Topsoil
    (() => {
      const g = layersConfig[0].group;
      const plotSize = 18;
      const topsoil = new THREE.Mesh(new THREE.BoxGeometry(plotSize, 0.6, plotSize), materials.topsoil);
      topsoil.position.y = 0.3;
      topsoil.userData = { title: 'Topsoil Layer', desc: 'Fertile organic surface layer, pH 6.2-7.1', label: 'Thickness:', value: '600mm' };
      g.add(topsoil);

      // Grass overlay
      const grass = new THREE.Mesh(new THREE.BoxGeometry(plotSize + 0.2, 0.02, plotSize + 0.2), materials.grass);
      grass.position.y = 0.62;
      g.add(grass);

      // Plot boundary markers
      const boundaryGeo = new THREE.BoxGeometry(plotSize + 0.1, 0.08, 0.3);
      const boundaryMat = new THREE.LineBasicMaterial({ color: 0x10b981, linewidth: 3 });
      [-plotSize/2, plotSize/2].forEach(x => {
        const marker = new THREE.Mesh(boundaryGeo, materials.wireframe);
        marker.position.x = x;
        g.add(marker);
      });
      [-plotSize/2, plotSize/2].forEach(z => {
        const marker = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, plotSize + 0.1), materials.wireframe);
        marker.position.z = z;
        g.add(marker);
      });

      scene.add(g);
    })();

    // Build Layer 1 - Clay
    (() => {
      const g = layersConfig[1].group;
      const clay = new THREE.Mesh(new THREE.BoxGeometry(18, 1.4, 18), materials.clay);
      clay.position.y = -1.3;
      clay.userData = { title: 'Clay Subsoil', desc: 'Medium plasticity clay, SPT N=8-12', label: 'Depth Range:', value: '0.6m - 2.0m' };
      g.add(clay);
      scene.add(g);
    })();

    // Build Layer 2 - Sand
    (() => {
      const g = layersConfig[2].group;
      const sand = new THREE.Mesh(new THREE.BoxGeometry(18, 2.5, 18), materials.sand);
      sand.position.y = -3.25;
      sand.userData = { title: 'Sand & Gravel', desc: 'Medium coarse sand, good drainage', label: 'Depth Range:', value: '2.0m - 4.5m' };
      g.add(sand);

      // Utility pipes
      const sewePipe = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 16, 12), materials.pipeSewage);
      sewePipe.rotation.z = Math.PI / 2;
      sewePipe.position.set(-4, -3, 0);
      sewePipe.userData = { title: 'Municipal Sewer Line', desc: 'PVC Ø150mm gravity flow to street main', label: 'Invert Level:', value: '-3.8m' };
      g.add(sewePipe);

      const waterPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 16, 12), materials.pipeWater);
      waterPipe.rotation.z = Math.PI / 2;
      waterPipe.position.set(0, -3.2, -4);
      waterPipe.userData = { title: 'Potable Water Supply', desc: 'HDPE Ø63mm pressurized from main', label: 'Operating Pressure:', value: '2.5 bar' };
      g.add(waterPipe);

      const elecPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 16, 12), materials.pipeElectric);
      elecPipe.rotation.z = Math.PI / 2;
      elecPipe.position.set(4, -3.4, 4);
      elecPipe.userData = { title: 'HT Power Cable', desc: 'Armored 11kV underground feeder', label: 'Cable Type:', value: 'XLPE Insulated' };
      g.add(elecPipe);

      scene.add(g);
    })();

    // Build Layer 3 - Aquifer
    (() => {
      const g = layersConfig[3].group;
      const aquifer = new THREE.Mesh(new THREE.BoxGeometry(18, 2.0, 18), materials.water);
      aquifer.position.y = -5.0;
      aquifer.userData = { title: 'Groundwater Aquifer', desc: 'Confined sandy aquifer, yield 50 m³/hr', label: 'Water Table:', value: '-3.5m GRL' };
      g.add(aquifer);
      scene.add(g);
    })();

    // Build Layer 4 - Weathered Rock
    (() => {
      const g = layersConfig[4].group;
      const weathered = new THREE.Mesh(new THREE.BoxGeometry(18, 2.5, 18), materials.granite);
      weathered.position.y = -7.25;
      weathered.userData = { title: 'Laterite & Weathered Rock', desc: 'Highly weathered granite, variable strength', label: 'Bearing Capacity:', value: '200-300 kPa' };
      g.add(weathered);
      scene.add(g);
    })();

    // Build Layer 5 - Bedrock
    (() => {
      const g = layersConfig[5].group;
      const bedrock = new THREE.Mesh(new THREE.BoxGeometry(18, 3.0, 18), materials.bedrock);
      bedrock.position.y = -10.5;
      bedrock.userData = { title: 'Fresh Granite Bedrock', desc: 'Massive granitic basement, RQD >80%', label: 'Bearing Capacity:', value: '2000+ kPa' };
      g.add(bedrock);

      // Zoning envelope wireframe
      const zoningGeo = new THREE.BoxGeometry(20, 15, 20);
      const zoning = new THREE.Mesh(zoningGeo, materials.wireframe);
      zoning.position.y = 5;
      g.add(zoning);

      scene.add(g);
    })();

    // Setup UI
    const slider = document.getElementById('explode-slider');
    const sliderVal = document.getElementById('slider-val-text');
    const layersContainer = document.getElementById('layers-container');

    layersConfig.forEach((layer, idx) => {
      const div = document.createElement('div');
      div.className = `flex items-center justify-between p-2 rounded-xl bg-white/5 hover:bg-white/10 transition border border-white/5`;
      div.innerHTML = `
        <div class="flex items-center gap-2">
          <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border uppercase ${layer.color}">${layer.tag}</span>
          <span class="text-xs font-medium text-slate-200 truncate" title="${layer.name}">${layer.name}</span>
        </div>
        <label class="relative inline-flex cursor-pointer">
          <input type="checkbox" checked data-layer-idx="${idx}" class="sr-only peer">
          <div class="w-8 h-4 bg-slate-700 peer-checked:bg-emerald-500 rounded-full peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:h-3 after:w-3.5 after:rounded-full after:transition-all"></div>
        </label>
      `;
      layersContainer.appendChild(div);
    });

    layersContainer.addEventListener('change', (e) => {
      if (e.target.matches('input[type="checkbox"]')) {
        const idx = parseInt(e.target.dataset.layerIdx);
        layersConfig[idx].group.visible = e.target.checked;
      }
    });

    let targetExplosion = 0;
    let currentExplosion = 0;
    let autoExploding = false;
    let autoDir = 1;
    let rotating = false;

    slider.addEventListener('input', (e) => {
      targetExplosion = parseFloat(e.target.value) / 100;
      sliderVal.innerText = `${Math.round(targetExplosion * 100)}%`;
      autoExploding = false;
    });

    document.getElementById('btn-auto').addEventListener('click', function() {
      autoExploding = !autoExploding;
      this.classList.toggle('bg-emerald-500/40', autoExploding);
    });

    document.getElementById('btn-turntable').addEventListener('click', function() {
      rotating = !rotating;
      this.classList.toggle('bg-emerald-500/30', rotating);
    });

    document.getElementById('btn-iso').addEventListener('click', () => {
      camera.position.set(35, 28, 38);
      controls.target.set(0, 5, 0);
    });

    document.getElementById('btn-section').addEventListener('click', () => {
      camera.position.set(0, 18, 60);
      controls.target.set(0, 0, 0);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      targetExplosion = 0;
      slider.value = 0;
      sliderVal.innerText = '0%';
      autoExploding = false;
      rotating = false;
      document.getElementById('btn-auto').classList.remove('bg-emerald-500/40');
      document.getElementById('btn-turntable').classList.remove('bg-emerald-500/30');
      camera.position.set(35, 28, 38);
      controls.target.set(0, 5, 0);
    });

    // Raycast inspection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('inspector-card');
    let hoveredMesh = null;
    let originalEmissive = null;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (tooltip.style.display !== 'none') {
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY + 15) + 'px';
      }
    });

    function checkHover() {
      raycaster.setFromCamera(mouse, camera);
      const allMeshes = [];
      layersConfig.forEach(l => {
        if (l.group.visible) {
          l.group.traverse(child => {
            if (child.isMesh && child.userData?.title) allMeshes.push(child);
          });
        }
      });

      const hits = raycaster.intersectObjects(allMeshes);
      if (hits.length > 0) {
        const obj = hits[0].object;
        if (hoveredMesh !== obj) {
          if (hoveredMesh?.material?.emissive) hoveredMesh.material.emissive.setHex(originalEmissive);
          hoveredMesh = obj;
          originalEmissive = obj.material?.emissive?.getHex() || 0;
          if (obj.material?.emissive) obj.material.emissive.setHex(0x10b981);

          document.getElementById('tt-title').innerText = obj.userData.title;
          document.getElementById('tt-desc').innerText = obj.userData.desc;
          document.getElementById('tt-label').innerText = obj.userData.label;
          document.getElementById('tt-value').innerText = obj.userData.value;
          tooltip.style.display = 'block';
        }
      } else {
        if (hoveredMesh?.material?.emissive) hoveredMesh.material.emissive.setHex(originalEmissive);
        hoveredMesh = null;
        tooltip.style.display = 'none';
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (autoExploding) {
        targetExplosion += autoDir * 0.3 * delta;
        if (targetExplosion >= 1) { targetExplosion = 1; autoDir = -1; }
        if (targetExplosion <= 0) { targetExplosion = 0; autoDir = 1; }
        slider.value = Math.round(targetExplosion * 100);
        sliderVal.innerText = `${Math.round(targetExplosion * 100)}%`;
      }

      currentExplosion += (targetExplosion - currentExplosion) * 0.1;
      layersConfig.forEach(layer => {
        layer.group.position.y = layer.baseY + (currentExplosion * layer.explosion);
      });

      if (rotating) scene.rotation.y += 0.4 * delta;
      else scene.rotation.y = 0;

      controls.update();
      checkHover();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
