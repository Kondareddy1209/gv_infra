<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GV Infra Map Test</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100%; background: #e0e0e0; }
    .info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 5px; z-index: 1000; max-width: 300px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info">
    <h3>GV Infra Land Map — Test Version</h3>
    <p>Loading... Check console for errors</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <script>
    console.log('📍 GV Infra Map Test - Starting');

    // Initialize map
    const map = L.map('map', {
      center: [17.2480, 80.1365],
      zoom: 17,
      zoomControl: true
    });
    console.log('✅ Map initialized at center:', [17.2480, 80.1365]);

    // Add tile layer
    L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['0', '1', '2', '3'],
      attribution: '© Google'
    }).addTo(map);
    console.log('✅ Google Satellite tiles added');

    // Load and display plots
    fetch('custom_plots.geojson')
      .then(r => {
        console.log('📥 Response received:', r.status);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        console.log('✅ GeoJSON parsed:', data.features.length, 'plots');

        L.geoJSON(data, {
          style: {
            color: '#10b981',
            weight: 2,
            opacity: 0.8,
            fillOpacity: 0.3
          },
          onEachFeature: (feature, layer) => {
            const props = feature.properties;
            layer.bindPopup(`
              <strong>${props.plot_number}</strong><br>
              Status: ${props.status}<br>
              Area: ${props.size} sq.yds<br>
              Facing: ${props.facing}
            `);
          }
        }).addTo(map);

        // Fit bounds
        const bounds = L.geoJSON(data).getBounds();
        map.fitBounds(bounds, { padding: [50, 50] });
        console.log('✅ Plots rendered on map');

        document.querySelector('.info').innerHTML = `
          <h3>✅ Map Ready</h3>
          <p><strong>${data.features.length}</strong> plots loaded</p>
          <p><strong>Zoom:</strong> ${map.getZoom()}</p>
          <p><strong>Center:</strong> ${map.getCenter().lat.toFixed(4)}, ${map.getCenter().lng.toFixed(4)}</p>
          <p>Click plots to see details. Zoom in/out to explore.</p>
        `;
      })
      .catch(err => {
        console.error('❌ Error:', err);
        document.querySelector('.info').innerHTML = `
          <h3>❌ Error Loading Plots</h3>
          <p>${err.message}</p>
          <p>Check browser console (F12) for details</p>
        `;
      });
  </script>
</body>
</html>
