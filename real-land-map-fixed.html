<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GV Infra 2D Land Editor — Leaflet Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; background: #0b0f19; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .leaflet-control-attribution { display: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">

  <!-- Map -->
  <div id="map"></div>

  <!-- Header -->
  <header class="absolute top-4 left-4 z-20 pointer-events-none">
    <div class="glass-panel rounded-xl px-4 py-3 flex items-center gap-3 pointer-events-auto shadow-2xl">
      <div class="w-9 h-9 rounded-lg bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-emerald-400 text-lg">🗺️</div>
      <div>
        <h1 class="font-bold text-sm">GV INFRA 2D LAND EDITOR</h1>
        <p class="text-xs text-slate-400">Draw & Edit Plot Boundaries</p>
      </div>
    </div>
  </header>

  <!-- Instructions -->
  <aside class="absolute bottom-6 left-4 z-20 glass-panel p-4 rounded-xl w-72 pointer-events-auto shadow-2xl">
    <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-3">📍 How to Use</h3>
    <ul class="text-xs text-slate-300 space-y-2">
      <li><strong>Draw:</strong> Click the rectangle/polygon tool</li>
      <li><strong>Edit:</strong> Click Edit tool, then drag vertices</li>
      <li><strong>Delete:</strong> Click Delete tool, then click shape</li>
      <li><strong>Save:</strong> Shapes are auto-saved to browser</li>
    </ul>
    <div class="mt-4 pt-4 border-t border-slate-700/50">
      <button onclick="exportGeoJSON()" class="w-full py-2 px-3 bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/30 text-sky-300 rounded-lg text-xs font-semibold transition">
        📥 Export as GeoJSON
      </button>
    </div>
  </aside>

  <script>
    // Initialize Leaflet Map
    const map = L.map('map').setView([17.2480, 80.1365], 17);

    // Add Google Satellite Layer
    L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['0', '1', '2', '3'],
      attribution: '© Google'
    }).addTo(map);

    // Add Leaflet Draw
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      position: 'topleft',
      draw: {
        polygon: { shapeOptions: { color: '#10b981', opacity: 0.7, weight: 2 } },
        polyline: false,
        rectangle: { shapeOptions: { color: '#3b82f6', opacity: 0.7, weight: 2 } },
        circle: false,
        marker: false,
        circlemarker: false
      },
      edit: {
        featureGroup: drawnItems,
        remove: true
      }
    });
    map.addControl(drawControl);

    // Sample Plots (Peacock Valley)
    const samplePlots = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {
            "id": "PV-001",
            "name": "Plot #001",
            "area": "1800 Sq.Yds",
            "facing": "East",
            "status": "Available",
            "price": "₹35.1 L"
          },
          "geometry": {
            "type": "Polygon",
            "coordinates": [[[80.1360, 17.2485], [80.1365, 17.2485], [80.1365, 17.2480], [80.1360, 17.2480], [80.1360, 17.2485]]]
          }
        },
        {
          "type": "Feature",
          "properties": {
            "id": "PV-002",
            "name": "Plot #002",
            "area": "1800 Sq.Yds",
            "facing": "East",
            "status": "Reserved",
            "price": "₹35.1 L"
          },
          "geometry": {
            "type": "Polygon",
            "coordinates": [[[80.1366, 17.2485], [80.1371, 17.2485], [80.1371, 17.2480], [80.1366, 17.2480], [80.1366, 17.2485]]]
          }
        },
        {
          "type": "Feature",
          "properties": {
            "id": "PV-003",
            "name": "Plot #003",
            "area": "1800 Sq.Yds",
            "facing": "North",
            "status": "Sold",
            "price": "₹35.1 L"
          },
          "geometry": {
            "type": "Polygon",
            "coordinates": [[[80.1360, 17.2475], [80.1365, 17.2475], [80.1365, 17.2470], [80.1360, 17.2470], [80.1360, 17.2475]]]
          }
        }
      ]
    };

    // Load sample plots
    L.geoJSON(samplePlots, {
      style: {
        color: '#10b981',
        weight: 2,
        opacity: 0.6,
        fillOpacity: 0.3
      },
      onEachFeature: (feature, layer) => {
        const props = feature.properties;
        layer.bindPopup(`
          <div class="p-2 text-xs">
            <strong>${props.name}</strong><br>
            Area: ${props.area}<br>
            Facing: ${props.facing}<br>
            Status: ${props.status}<br>
            Price: ${props.price}
          </div>
        `);
      }
    }).addTo(map);

    // Draw events
    map.on('draw:created', (e) => {
      const layer = e.layer;
      drawnItems.addLayer(layer);
      console.log('✅ Plot drawn:', layer.toGeoJSON());
      saveToBrowser();
    });

    map.on('draw:edited', (e) => {
      console.log('✏️ Plot edited');
      saveToBrowser();
    });

    map.on('draw:deleted', (e) => {
      console.log('🗑️ Plot deleted');
      saveToBrowser();
    });

    // Save to browser localStorage
    function saveToBrowser() {
      const data = drawnItems.toGeoJSON();
      localStorage.setItem('plotsGeoJSON', JSON.stringify(data));
      console.log('💾 Saved to browser');
    }

    // Load from browser localStorage
    function loadFromBrowser() {
      const saved = localStorage.getItem('plotsGeoJSON');
      if (saved) {
        const data = JSON.parse(saved);
        L.geoJSON(data, {
          onEachFeature: (feature, layer) => {
            drawnItems.addLayer(layer);
          }
        });
        console.log('✅ Loaded from browser');
      }
    }

    // Export as GeoJSON file
    function exportGeoJSON() {
      const data = drawnItems.toGeoJSON();
      const dataStr = JSON.stringify(data, null, 2);
      const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

      const exportFileDefaultName = 'plots-' + new Date().toISOString().slice(0, 10) + '.geojson';

      const linkElement = document.createElement('a');
      linkElement.setAttribute('href', dataUri);
      linkElement.setAttribute('download', exportFileDefaultName);
      linkElement.click();

      alert('✅ GeoJSON exported: ' + exportFileDefaultName);
    }

    // Load saved data on page load
    window.addEventListener('load', () => {
      loadFromBrowser();
      console.log('🗺️ Leaflet map ready');
    });

    // Make drawnItems accessible globally for 3D sync
    window.landEditorInstance = {
      drawnItems: drawnItems,
      map: map
    };
  </script>
</body>
</html>
