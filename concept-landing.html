<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stambadri Enclave | Premium Open Plot Development | Khammam, Telangana</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #ff9800;
            --accent-color: #1976d2;
            --light-bg: #f5f5f5;
            --dark-text: #212121;
            --light-text: #ffffff;
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient-primary: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
            --gradient-secondary: linear-gradient(135deg, #ff9800 0%, #ffb74d 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark-text);
            overflow-x: hidden;
            line-height: 1.6;
        }
        
        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }
        
        .logo i {
            color: var(--secondary-color);
            font-size: 2.2rem;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }
        
        nav a {
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
            position: relative;
            padding: 0.5rem 0;
            transition: var(--transition);
            font-size: 1.1rem;
        }
        
        nav a:hover {
            color: var(--primary-color);
        }
        
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--primary-color);
            transition: var(--transition);
            border-radius: 3px;
        }
        
        nav a:hover::after {
            width: 100%;
        }
        
        .cta-button {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.3);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.4);
        }
        
        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-size: cover;
        }
        
        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }
        
        .hero-text h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--dark-text);
            font-weight: 800;
            letter-spacing: -1px;
        }
        
        .hero-text h1 span {
            color: var(--primary-color);
            position: relative;
        }
        
        .hero-text p {
            font-size: 1.3rem;
            margin-bottom: 2.5rem;
            color: #555;
            max-width: 500px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.8rem;
            margin-top: 2.5rem;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 1.2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .feature:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .feature i {
            color: var(--primary-color);
            font-size: 1.8rem;
            min-width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(46, 125, 50, 0.1);
            border-radius: 50%;
        }
        
        /* 3D Viewer Section */
        .viewer-section {
            background: linear-gradient(135deg, #1a237e 0%, #4a148c 100%);
            padding: 5rem 3rem;
            position: relative;
            overflow: hidden;
            margin: 4rem 0;
        }
        
        .viewer-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .viewer-header h2 {
            color: var(--light-text);
            font-size: 2.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .viewer-header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.3rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        #masterplan-container {
            height: 700px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 1.2rem;
            border-radius: 15px;
            display: flex;
            gap: 0.8rem;
            z-index: 10;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }
        
        .control-btn:hover {
            background: var(--gradient-secondary);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
        }
        
        /* Plot Showcase */
        .plot-showcase {
            max-width: 1400px;
            margin: 6rem auto;
            padding: 0 3rem;
        }
        
        .showcase-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .showcase-header h2 {
            font-size: 2.5rem;
            color: var(--dark-text);
            margin-bottom: 1rem;
        }
        
        .filters {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: white;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }
        
        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-color);
            color: white;
        }
        
        .plot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
        }
        
        .plot-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            position: relative;
        }
        
        .plot-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .plot-image {
            height: 250px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }
        
        .plot-status {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--secondary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .plot-content {
            padding: 2rem;
        }
        
        .plot-price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .plot-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .detail-item i {
            color: var(--primary-color);
        }
        
        .plot-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .action-btn {
            flex: 1;
            padding: 0.8rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
        }
        
        .view-btn {
            background: var(--gradient-primary);
            color: white;
        }
        
        .book-btn {
            background: var(--gradient-secondary);
            color: white;
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Stats Section */
        .stats-section {
            background: var(--gradient-primary);
            padding: 5rem 3rem;
            color: white;
            text-align: center;
        }
        
        .stats-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 3rem;
        }
        
        .stat-item {
            padding: 2rem;
        }
        
        .stat-number {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            font-size: 1.2rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-tree"></i>
            <span>Stambadri Enclave</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="project.html">3D Masterplan</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <button class="cta-button">
            <i class="fas fa-phone-alt"></i> Call Sales
        </button>
    </header>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>Premium Open Plots in <span>Khammam</span></h1>
                <p>Explore real satellite imagery and interactive 3D layout of Stambadri Enclave, Gurralapadu.</p>
                <div class="features">
                    <div class="feature"><i class="fas fa-road"></i> 50ft & 40ft Blacktop Roads</div>
                    <div class="feature"><i class="fas fa-shield-alt"></i> Gated Boundary Wall</div>
                    <div class="feature"><i class="fas fa-file-signature"></i> DTCP & RERA Approved</div>
                    <div class="feature"><i class="fas fa-landmark"></i> 100% Clear Title & Vastu</div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
