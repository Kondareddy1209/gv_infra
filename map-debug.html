<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Map Debug</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    body { margin: 0; padding: 20px; font-family: monospace; background: #222; color: #0f0; }
    #map { width: 100%; height: 400px; border: 2px solid #0f0; margin: 20px 0; }
    .log { margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Leaflet Map Debug</h2>
  <div id="status"></div>
  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const status = document.getElementById('status');

    function log(msg) {
      console.log(msg);
      status.innerHTML += '<div class="log">✓ ' + msg + '</div>';
    }

    function error(msg) {
      console.error(msg);
      status.innerHTML += '<div class="log" style="color:#f00;">✗ ' + msg + '</div>';
    }

    try {
      log('Page loaded');

      if (!window.L) {
        error('Leaflet not loaded');
        throw new Error('Leaflet missing');
      }
      log('Leaflet library loaded');

      const container = document.getElementById('map');
      if (!container) {
        error('Map container not found');
        throw new Error('Container missing');
      }
      log('Map container found, size: ' + container.offsetWidth + 'x' + container.offsetHeight);

      const map = L.map('map').setView([17.0854, 78.4908], 13);
      log('Map object created');

      const tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      });
      log('Tile layer created (OpenStreetMap)');

      tileLayer.addTo(map);
      log('Tiles added to map');

      tileLayer.on('tileload', function() {
        log('Tile loaded successfully');
      });

      tileLayer.on('tileerror', function(err) {
        error('Tile error: ' + err);
      });

      log('Setup complete - map should be visible above');

    } catch (e) {
      error('Fatal: ' + e.message);
      console.error(e);
    }
  </script>
</body>
</html>
